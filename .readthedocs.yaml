# ReadTheDocs build configuration for SHERLOCK.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.10"
  apt_packages:
    - pandoc          # required by nbsphinx to convert notebooks

sphinx:
  configuration: docs/conf.py

python:
  install:
    - requirements: docs/requirements-docs.txt
  # The deep-learning stack (torch / pyro / scvi-tools / scanpy) is mocked in
  # docs/conf.py via autodoc_mock_imports, so the full package is not installed here.
